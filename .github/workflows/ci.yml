name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS is required: the Swift helper links PhotoKit, Vision, Speech and MapKit (macOS 26 SDK).
    # No real Photos, DeepSeek, MapKit, Instagram or permissions are used — live tests are #[ignore]d.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use the runner's Xcode toolchain
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcrun --show-sdk-version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm ci
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Production frontend build
        run: npm run build

      - name: Rust tests (builds the Swift helper too)
        working-directory: src-tauri
        run: cargo test --locked
