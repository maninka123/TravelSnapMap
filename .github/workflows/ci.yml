name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    # Type-check, UI tests (against the in-memory demo backend) and the production build. Fast; any OS works.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: UI tests
        run: npm test
      - name: Production build
        run: npm run build

  macos:
    # The Swift helper links PhotoKit, Vision, Speech and MapKit, so the app and its tests build on macOS.
    # No real Photos, DeepSeek, MapKit or Instagram are used — live tests are #[ignore]d.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Use the runner's Xcode toolchain
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcrun --show-sdk-version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Rust tests, migrations and accuracy gates (builds the Swift helper too)
        working-directory: src-tauri
        run: cargo test --locked -- --nocapture
      - name: Build the app bundle (unsigned)
        run: npm run tauri build -- --bundles app
